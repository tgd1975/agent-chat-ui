# LiteLLM proxy config — the "configurable LLM" knob.
# Exposes an OpenAI-compatible endpoint on :4000 (the agent calls /v1).
# Switch models by setting AGENT_MODEL (in .env) to one of the model_name values.
#
#   litellm --config litellm.config.yaml --port 4000

model_list:
  # Default route — real Claude. Keep this as the default for best skill/tool fidelity.
  - model_name: claude-default
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY

  # Second route — an OpenAI-compatible "LLM farm" / internal endpoint.
  - model_name: farm-gpt
    litellm_params:
      model: openai/your-farm-model
      api_base: https://llm-farm.internal/v1
      api_key: os.environ/FARM_API_KEY

  # Third route — Azure OpenAI (Copilot-style). The part after "azure/" is the
  # Azure *deployment name* (deploy.sh creates one literally named "chat" and
  # auto-picks whatever current chat model is available). Set AGENT_MODEL=copilot.
  - model_name: copilot
    litellm_params:
      model: azure/chat
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: os.environ/AZURE_API_VERSION

  # Fourth route — a fully LOCAL model via Ollama (no cloud, no API key).
  # Used by the docker-compose setup. Set AGENT_MODEL=ollama.
  - model_name: ollama
    litellm_params:
      model: ollama_chat/llama3.2
      api_base: os.environ/OLLAMA_BASE_URL   # e.g. http://ollama:11434

  # Fifth route — GitHub Models: use GPT-4o(-mini) etc. with a GitHub Personal
  # Access Token (fine-grained token with the "Models" permission). This is the
  # legitimate, API-based way to use models via your GitHub account. It is NOT
  # the Copilot editor subscription (repurposing that is against GitHub's terms).
  # Free dev tier is rate-limited but fine for a feasibility test. AGENT_MODEL=github.
  - model_name: github
    litellm_params:
      model: github/gpt-4o-mini      # or github/gpt-4o for the bigger model
      api_key: os.environ/GITHUB_API_KEY

litellm_settings:
  drop_params: true        # silently drop params a given provider doesn't support

general_settings:
  master_key: os.environ/ANTHROPIC_AUTH_TOKEN   # clients authenticate with this
