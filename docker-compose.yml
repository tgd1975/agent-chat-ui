# Local stack using GitHub Models as the LLM backend.
#
#   1) cp .env.example .env   and put your GitHub token in GITHUB_API_KEY
#   2) docker compose up --build
#   3) open http://localhost:8000
#
# One container runs LiteLLM (:4000) + Chainlit (:8000) + the Pydantic AI agent.
# LiteLLM routes to GitHub Models (api authenticated with your GitHub PAT).
services:
  app:
    build: .
    env_file:
      - .env                                  # provides GITHUB_API_KEY
    environment:
      LLM_BASE_URL: http://localhost:4000/v1      # LiteLLM, OpenAI-compatible (same container)
      LLM_API_KEY: sk-local-master                # must match litellm master_key
      ANTHROPIC_AUTH_TOKEN: sk-local-master       # litellm master_key
      AGENT_MODEL: github                         # the LiteLLM route -> GitHub Models
      # Dummies so LiteLLM loads the other (unused) routes without complaint:
      ANTHROPIC_API_KEY: unused
      FARM_API_KEY: unused
      FARM_API_BASE: http://unused
      FARM_MODEL: openai/unused
      AZURE_API_KEY: unused
      AZURE_API_BASE: http://unused
      AZURE_API_VERSION: "2024-10-21"
      OLLAMA_BASE_URL: http://unused:11434
    ports:
      - "8000:8000"
